name: Code quality

on:
  push:
    branches:
      - main
      - cloudflare
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: Run Biome
        run: biome ci

  build:
    name: Check & Build (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [static, ssr]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Astro Fonts
        uses: actions/cache@v5
        with:
          path: .astro/fonts
          key: astro-fonts-cache-v1

      - name: Cache OG Fonts
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/og-fonts
          key: og-fonts-cache-v1

      - name: Configure SSR mode
        if: matrix.mode == 'ssr'
        env:
          PROJECT_NAME: thought-lite
          DATABASE_NAME: thoughts
          DATABASE_ID: 00000000-0000-0000-0000-000000000000
        run: |
          sed -i '/comment:/,/}/ s/enable: false/enable: true/' site.config.ts
          envsubst < wrangler.example.toml > wrangler.toml
          pnpm run types

      - name: Type check
        run: pnpm run check

      - name: Build project
        run: pnpm run build
