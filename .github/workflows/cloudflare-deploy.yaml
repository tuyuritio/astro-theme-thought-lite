name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'tuyuritio/astro-theme-thought-lite'
    runs-on: ubuntu-latest
    name: Deploy
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build for Cloudflare
        uses: ./.github/actions/cloudflare-build
        with:
          env: ${{ secrets.ENV }}
          project-name: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          database-name: ${{ secrets.CLOUDFLARE_DATABASE_NAME }}
          database-id: ${{ secrets.CLOUDFLARE_DATABASE_ID }}

      - name: Run database migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
