name: Deployment

on:
  push:
    branches:
      - cloudflare
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Export Environment Variables
        env:
          ENV_CONTENT: ${{ secrets.ENV }}
        run: printf '%s\n' "$ENV_CONTENT" > .env

      - name: Create wrangler.toml from template
        env:
          PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          DATABASE_NAME: ${{ secrets.CLOUDFLARE_DATABASE_NAME }}
          DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
        run: envsubst < wrangler.example.toml > wrangler.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Astro Fonts
        uses: actions/cache@v5
        with:
          path: .astro/fonts
          key: astro-fonts-cache-v1

      - name: Cache OG Fonts
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/og-fonts
          key: og-fonts-cache-v1

      - name: Enable comment system for official demo
        if: github.repository == 'tuyuritio/astro-theme-thought-lite'
        run: |
          sed -i '/comment:/,/}/ s/enable: false/enable: true/' site.config.ts

      - name: Build project
        run: pnpm run build

      - name: Run database migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
